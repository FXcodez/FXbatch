[project]
name = "fxbatch"
version = "2.5.0"
description = "FXbatch Resizer 2.5.0 — Fast multi-format batch image compression, resizing and icon converter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ctkmessagebox>=2.7",
    "customtkinter>=6.0.0",
    "pillow>=10.0.0",
    "tkinterdnd2>=0.6.3",
]

[tool.uv]
package = false
link-mode = "copy"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
